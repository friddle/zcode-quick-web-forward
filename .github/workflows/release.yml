name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            goos: linux
            goarch: amd64
            ext: ""
          - os: linux
            goos: linux
            goarch: arm64
            ext: ""
          - os: darwin
            goos: darwin
            goarch: amd64
            ext: ""
          - os: darwin
            goos: darwin
            goarch: arm64
            ext: ""
          - os: windows
            goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build
        run: |
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags "-s -w" \
          -o zcode-quick-web-forward-${{ matrix.os }}-${{ matrix.goarch }}${{ matrix.ext }} \
          ./cmd/zcode-quick-web-forward
      - name: upload
        uses: softprops/action-gh-release@v2
        with:
          files: zcode-quick-web-forward-${{ matrix.os }}-${{ matrix.goarch }}${{ matrix.ext }}